# Local environment: PostgreSQL + the API built from source.
#   docker compose up --build      (or: podman compose up --build)
# The credentials below belong to a disposable local database; in AWS they live in Secrets Manager.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: franchise
      POSTGRES_USER: franchise
      POSTGRES_PASSWORD: franchise
    # Not published on the host: the API reaches it through the compose network (avoids clashing with a local 5432).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U franchise -d franchise"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    image: franchise-api:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_USERNAME: franchise
      DB_PASSWORD: franchise
    ports:
      - "8080:8080"
