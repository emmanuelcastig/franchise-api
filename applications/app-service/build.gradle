apply plugin: 'org.springframework.boot'

dependencies {
	implementation project(':reactive-web')
	implementation project(':resilience')
	implementation "com.github.bancolombia:aws-secrets-manager-async:${secretsManagerVersion}"
	implementation 'software.amazon.awssdk:regions'
	implementation project(':r2dbc-postgresql')
    implementation project(':model')
    implementation project(':usecase')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation('org.springframework.boot:spring-boot-starter-opentelemetry') {
        exclude group: 'io.opentelemetry', module: 'opentelemetry-exporter-otlp'
    }
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testImplementation 'tools.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation "io.github.resilience4j:resilience4j-circuitbreaker:${resilience4jVersion}"
    testImplementation "io.github.resilience4j:resilience4j-timelimiter:${resilience4jVersion}"
    testImplementation "io.github.resilience4j:resilience4j-retry:${resilience4jVersion}"
    testImplementation 'org.springframework:spring-tx'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
}

tasks.register('explodedJar', Copy) {
    with jar
    into layout.buildDirectory.dir("exploded")
}

jar {
    enabled = false
}

bootJar {
    archiveFileName = "${project.getParent().getName()}.${archiveExtension.get()}"
}
